name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install "ruff==0.15.22"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  imports-sanity:
    name: Imports sanity (compileall)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
      - name: Install lightweight subset (full runtime deps require torch/cvxpy)
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.0" "pandas>=2.0" "numpy>=1.24" "anthropic>=0.39" "python-dotenv>=1.0"
      - name: Compile-check top-level modules
        run: |
          # Only compile-check modules that don't require heavy runtime deps.
          # Full compile-check happens in unit-test job with full install.
          python -m compileall -q models.py config.py utils.py context_budget.py prompt_loader.py || echo "compileall soft-fail"

  unit-test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        run: pytest tests/ -x --tb=short -m "not integration and not slow"

  secret-scan:
    name: Secret scan (detect-secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install detect-secrets
        run: pip install "detect-secrets==1.5.0"
      - name: Scan for new secrets vs baseline
        run: |
          if [ ! -f .secrets.baseline ]; then
            echo "::error::.secrets.baseline missing. Run: detect-secrets scan > .secrets.baseline"
            exit 1
          fi
          detect-secrets scan --baseline .secrets.baseline
