# Pre-commit hooks — local git-commit gate for the agent-first-pm refactor.
# Install once per clone: `pre-commit install`
# Run manually: `pre-commit run --all-files`
#
# Deliberately conservative: real-bug hooks + formatting, no autopilot / no
# LLM-in-the-loop. Fast enough to run on every commit without friction.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: end-of-file-fixer
        exclude: '\.secrets\.baseline$'
      - id: trailing-whitespace
        exclude: '\.md$'   # markdown may use trailing whitespace intentionally
      - id: check-merge-conflict
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: 'package(-lock)?\.json$|\.ipynb$'
