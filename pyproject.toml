[project]
name = "ai-financial-analyst"
version = "0.1.0"
description = "Agentic financial analysis system using SEC filings, market data, and multi-agent LLM synthesis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "anthropic>=0.39.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "requests>=2.25.0",
    "tavily-python>=0.3.0",
    "yfinance>=0.2.54",
    "fpdf2>=2.8.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "numpy>=1.24.0",
    "fredapi>=0.5",
    "edgartools>=2.0",
    "scipy>=1.10",
    "pinecone>=3.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
py-modules = [
    "orchestrator",
    "market_enrichment",
    "peer_enrichment",
    "rag_enrichment",
    "prompt_loader",
    "context_budget",
    "utils",
    "report",
    "config",
    "models",
    "main",
    "app",
    "tiingo_client",
    "fmp_client",
]
packages = ["agents", "llm", "sec", "quant", "warehouse"]
